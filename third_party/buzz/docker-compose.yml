name: buzz

services:
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "postgres"
      com.buzz.env: "dev"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    ports:
      - "6379:6379"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "redis"
      com.buzz.env: "dev"
    restart: unless-stopped

  # Optional convenience S3-compatible store for local dev. Not started by a
  # plain `docker compose up` — it's gated behind the `minio` profile so the
  # stack doesn't force a MinIO container just to boot. Start it explicitly
  # with `docker compose --profile minio up -d` (or `docker compose up -d
  # minio minio-init`, or `COMPOSE_PROFILES=minio` in .env) when you want it,
  # or point BUZZ_S3_ENDPOINT at any other S3-compatible endpoint instead.
  minio:
    image: minio/minio:latest
    container_name: buzz-minio
    command: server /data --console-address ":9001"
    profiles: ["minio"]
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    labels:
      com.buzz.service: "minio"
      com.buzz.env: "dev"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: buzz-minio-init
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - buzz-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 buzz_dev buzz_dev_secret &&
        mc mb --ignore-existing local/buzz-media &&
        mc anonymous set none local/buzz-media
      "
    labels:
      com.buzz.service: "minio-init"
      com.buzz.env: "dev"
    restart: "no"

volumes:
  postgres-data:
    name: buzz-postgres-data
    labels:
      com.buzz.volume: "postgres"
  minio-data:
    name: buzz-minio-data
    labels:
      com.buzz.volume: "minio"

networks:
  buzz-net:
    name: buzz-net
    driver: bridge
    labels:
      com.buzz.network: "dev"
