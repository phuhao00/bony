[package]
name = "buzz-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/phuhao00/buzz"
description = "Core types, event verification, and filter matching for Buzz"

[features]
test-utils = []

[dependencies]
base64     = { workspace = true }
nostr      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
uuid       = { workspace = true }
chrono     = { workspace = true }
hex        = { workspace = true }
hmac       = { workspace = true }
sha2 = "0.11"
rand = "0.10"
subtle            = { workspace = true }
zeroize           = { workspace = true }
percent-encoding  = "2.3"
url               = { workspace = true }

# NO tokio, NO sqlx, NO redis, NO axum — zero I/O dependencies
