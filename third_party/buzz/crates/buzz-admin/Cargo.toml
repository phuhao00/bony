[package]
name = "buzz-admin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/phuhao00/buzz"
description = "Operator CLI for Buzz relay administration"

[[bin]]
name = "buzz-admin"
path = "src/main.rs"

[dependencies]
buzz-db = { workspace = true }
buzz-core = { workspace = true }
buzz-auth = { workspace = true }
buzz-pubsub = { workspace = true }
buzz-search = { workspace = true }
buzz-audit = { workspace = true }
buzz-workflow = { workspace = true }
buzz-media = { workspace = true }
nostr = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
# rustls TLS (Postgres, S3) needs a process CryptoProvider installed at
# startup; both aws-lc-rs and ring are compiled in transitively elsewhere in
# the graph, so rustls can't auto-select one — we install ring explicitly in
# main(). Mirrors buzz-relay's setup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
clap = { version = "4", features = ["derive"] }
