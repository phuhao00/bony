[package]
name = "buzz-push-gateway"
description = "Blind, capability-gated NIP-PL gateway for the Buzz mobile app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/phuhao00/buzz"

[lib]
name = "buzz_push_gateway"
path = "src/lib.rs"

[[bin]]
name = "buzz-push-gateway"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
appattest = { version = "0.1.1", default-features = false }
axum = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
byteorder = "1.5"
minicbor = "0.25"
chrono = { workspace = true }
hex = { workspace = true }
getrandom = "0.4"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
nostr = { workspace = true }
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
