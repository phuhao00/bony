[package]
name = "buzz-acp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/phuhao00/buzz"
description = "ACP harness that bridges Buzz events to AI agents"

[lib]
name = "buzz_acp"
path = "src/lib.rs"

[[bin]]
name = "buzz-acp"
path = "src/main.rs"

[dependencies]
# Internal
buzz-core = { workspace = true }
buzz-sdk = { workspace = true }
buzz-persona = { path = "../buzz-persona" }

# Nostr
nostr = { workspace = true }

# Async runtime
tokio = { workspace = true }

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# Codec (bounded line reads)
# Workspace default only enables "rt"; ACP framed-line reader needs "codec".
tokio-util = { version = "0.7", features = ["rt", "codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = { workspace = true }

# HTTP (channel discovery REST API)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# IDs
uuid = { workspace = true }
chrono = { workspace = true }

# URL parsing
url = { workspace = true }

# NIP-98 HTTP auth signing
sha2 = "0.11"
base64 = "0.22"
hex = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
dunce = { workspace = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config file
toml = "1.0"

# Filter expressions
evalexpr = { workspace = true }

# Process-group kill (safe wrapper around killpg) — Unix-only; kill_process_group
# has a #[cfg(not(unix))] fallback in acp.rs.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
httparse = "1"
