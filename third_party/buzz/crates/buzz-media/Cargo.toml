[package]
name = "buzz-media"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/phuhao00/buzz"
description = "Media storage, validation, and thumbnail generation for Buzz"

[dependencies]
buzz-core = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.11"
hex = { workspace = true }
chrono = { workspace = true }
ulid = "1"
uuid = { workspace = true }
axum = { workspace = true }
s3 = { version = "0.37", package = "rust-s3", default-features = false, features = ["tokio-rustls-tls", "fail-on-err", "tags"] }
infer = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
blurhash = "0.2"
imagesize = "0.14"
bytes = "1"
mp4 = "0.14"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
futures-core = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
