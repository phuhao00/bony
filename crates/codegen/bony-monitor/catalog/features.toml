# Curated product features for bony-monitor (hot-reloaded at runtime).

[[features]]
id = "coding-workspace"
name = "Coding Workspace"
category = "桌面体验"
description = "频道内编码界面、本地工程选择、最近项目与频道/工作区切换"
user_facing = true
paths = [
  "third_party/buzz/desktop/src/features/channels/ui/CodingWorkspaceScreen.tsx",
  "third_party/buzz/desktop/src/features/channels/ui/codingWorkspaceSurface.ts",
  "third_party/buzz/desktop/src-tauri/src/commands/coding_workspace.rs",
]
keywords = ["coding workspace", "project directory", "open project", "编码工作区", "本地工程"]
severity = "high"
user_impact = "直接影响用户打开工程并进入编码任务的主路径"

[[features]]
id = "desktop-shell"
name = "Bony 桌面端"
category = "桌面体验"
description = "频道、线程、Coding Workspace、主题与窗口交互"
user_facing = true
paths = [
  "third_party/buzz/desktop/src/features/channels/",
  "third_party/buzz/desktop/src-tauri/src/lib.rs",
]
keywords = ["channel", "thread", "theme", "overlay", "inert", "title bar"]
severity = "high"
user_impact = "影响桌面导航、点击命中和界面切换是否顺滑"

[[features]]
id = "coding-agent-acp"
name = "Coding Agent ACP"
category = "Agent 运行时"
description = "ACP 会话池、队列、工程 cwd 绑定和 Agent 生命周期"
user_facing = true
paths = [
  "third_party/buzz/crates/buzz-acp/",
  "third_party/buzz/desktop/src-tauri/src/commands/messages.rs",
]
keywords = ["acp", "session", "cwd", "queue", "grok", "codex", "claude code"]
severity = "high"
user_impact = "影响 Coding Agent 是否在正确工程中稳定执行"

[[features]]
id = "room-collaboration"
name = "本地多 Agent 房间"
category = "协作"
description = "频道消息、线程、mention 路由、房间 seed 与专员交接"
user_facing = true
paths = [
  "third_party/buzz/crates/buzz-relay/",
  "third_party/buzz/desktop/src-tauri/src/commands/room_seed.rs",
  "scripts/buzz-room/prompts/",
]
keywords = ["mention", "room", "thread", "seed", "agent", "handoff"]
severity = "high"
user_impact = "影响 Grok 与各专员的分工、交接和反馈"

[[features]]
id = "local-persistence"
name = "本地持久化"
category = "基础设施"
description = "SQLite、WAL、进程内 pubsub 与单机启动栈"
user_facing = false
paths = [
  "third_party/buzz/crates/buzz-db/",
  "third_party/buzz/crates/buzz-pubsub/",
  "scripts/buzz-room/start-room-stack.ps1",
]
keywords = ["sqlite", "wal", "pubsub", "busy_timeout"]
severity = "high"
user_impact = "影响房间消息和状态在本机的可靠性"

[[features]]
id = "agent-runtime"
name = "Grok Agent 运行时"
category = "Agent 运行时"
description = "SessionActor、采样、工具、权限、workspace 与终端 TUI"
user_facing = true
paths = [
  "crates/codegen/xai-grok-shell/",
  "crates/codegen/xai-grok-agent/",
  "crates/codegen/xai-grok-tools/",
  "crates/codegen/xai-grok-workspace/",
  "crates/codegen/xai-grok-pager/",
]
keywords = ["sessionactor", "sampler", "tool", "permission", "workspace", "tui"]
severity = "high"
user_impact = "影响编码 Agent 的执行能力、工具调用与安全边界"

[[features]]
id = "partner-agents"
name = "专员 Agent 集成"
category = "协作"
description = "ZeroClaw、OpenMontage、Unity 与 DocSmith 的提示词和本机工具"
user_facing = true
paths = [
  "crates/codegen/bony-room-tools-mcp/",
  "crates/codegen/bony-docs-tools-mcp/",
  "scripts/buzz-room/prompts/",
]
keywords = ["zeroclaw", "openmontage", "unity", "docsmith"]
severity = "medium"
user_impact = "影响房间专员可用性与职责边界"

[[features]]
id = "monitor"
name = "架构与改动监控"
category = "可观测性"
description = "功能目录、架构视图、影响矩阵和提交时间线"
user_facing = false
paths = ["crates/codegen/bony-monitor/"]
keywords = ["monitor", "catalog", "impact", "architecture"]
severity = "medium"
user_impact = "影响开发者理解架构和回归范围的效率"

[[features]]
id = "documentation"
name = "文档与规范"
category = "工程体验"
description = "项目规范、协作契约、架构和启动说明"
user_facing = false
paths = ["docs/", "README.md", "README.en.md", "ARCHITECTURE.md", ".cursor/"]
keywords = ["docs", "readme", "architecture", "standards", "skill"]
severity = "low"
user_impact = "影响开发、协作和交付说明是否准确"
