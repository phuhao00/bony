# Portable Desktop release (Bony): windows-x64 + macOS aarch64 zip artifacts.
# Trigger: tag v0.1.6+ or workflow_dispatch with version input.
# Layout matches historical bony-desktop-v*-windows-x86_64.zip portable runtime.
#
# Note: macOS needs a darwin runner (no cross-compile from Windows). Apple
# signing/notarization intentionally omitted for unsigned portable CI builds.

name: Desktop portable release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.1.6)"
        required: true
        type: string
      create_release:
        description: "Create/update GitHub Release and upload assets"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-portable-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: third_party/buzz/desktop
        run: pnpm install

      - name: Build frontend
        working-directory: third_party/buzz/desktop
        run: pnpm build

      - name: Build sidecars (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-backend-kubernetes \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p buzz-cli

      - name: Stage Tauri externalBin sidecars
        shell: bash
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | sed -n 's|host: ||p')
          BIN_DIR="third_party/buzz/desktop/src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          if [[ "$HOST" == *windows* ]]; then EXE=.exe; else EXE=; fi
          for name in buzz-acp buzz-agent buzz-backend-kubernetes buzz-dev-mcp git-credential-nostr buzz; do
            src="target/release/${name}${EXE}"
            dst="$BIN_DIR/${name}-${HOST}${EXE}"
            test -f "$src" || { echo "missing $src"; exit 1; }
            cp "$src" "$dst"
            [[ -n "$EXE" ]] || chmod 755 "$dst"
            echo "staged $dst"
          done

      - name: Build desktop (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p buzz-desktop

      - name: Stage portable zip
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="dist/bony-desktop-v${VERSION}-windows-x86_64"
          mkdir -p "$STAGE"
          REL=target/release
          for f in \
            buzz-desktop.exe \
            buzz-acp.exe \
            buzz-agent.exe \
            buzz-backend-kubernetes.exe \
            buzz-dev-mcp.exe \
            buzz.exe \
            git-credential-nostr.exe \
            buzz_lib.dll \
            onnxruntime.dll \
            onnxruntime_providers_shared.dll \
            sherpa-onnx-c-api.dll \
            sherpa-onnx-cxx-api.dll
          do
            if [[ -f "$REL/$f" ]]; then
              cp "$REL/$f" "$STAGE/"
            else
              echo "missing: $f" >&2
              if [[ "$f" == *.dll ]]; then
                echo "(optional dll skip)"
              else
                exit 1
              fi
            fi
          done
          cat > "$STAGE/README.txt" <<EOF
          Bony Desktop v${VERSION} (Windows x86_64)
          ================================

          Contents
          - buzz-desktop.exe  main desktop app (Tauri)
          - buzz-acp.exe, buzz-agent.exe, buzz.exe and other sidecars
          - sherpa-onnx / onnxruntime DLLs (local STT)

          Requirements
          - Windows 10/11 x64
          - WebView2 Runtime (usually preinstalled)
          - Local grok CLI for coding agents: npm i -g @xai-official/grok
          - For room collaboration: start buzz-relay (or room stack) separately

          Quick start
          1. Unzip this archive
          2. Run buzz-desktop.exe
          3. Point agent / BYOK via %USERPROFILE%\\.grok\\config.toml

          Source: https://github.com/phuhao00/bony
          Commit: ${GITHUB_SHA}
          EOF
          mkdir -p dist
          powershell -Command "Compress-Archive -Path '${STAGE}\\*' -DestinationPath 'dist\\bony-desktop-v${VERSION}-windows-x86_64.zip' -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/bony-desktop-v${{ needs.version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS aarch64
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    # Prefer shipping Windows if macOS fails (toolchain / native deps).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: third_party/buzz/desktop
        run: pnpm install

      - name: Build frontend
        working-directory: third_party/buzz/desktop
        run: pnpm build

      - name: Install system deps
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Build sidecars (release)
        run: |
          set -euo pipefail
          cargo build --release \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-backend-kubernetes \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p buzz-cli

      - name: Stage Tauri externalBin sidecars
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | sed -n 's|host: ||p')
          BIN_DIR="third_party/buzz/desktop/src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          for name in buzz-acp buzz-agent buzz-backend-kubernetes buzz-dev-mcp git-credential-nostr buzz; do
            src="target/release/${name}"
            dst="$BIN_DIR/${name}-${HOST}"
            test -f "$src" || { echo "missing $src"; exit 1; }
            cp "$src" "$dst"
            chmod 755 "$dst"
            echo "staged $dst"
          done

      - name: Build desktop (release)
        run: |
          set -euo pipefail
          cargo build --release -p buzz-desktop

      - name: Stage portable zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="dist/bony-desktop-v${VERSION}-macos-aarch64"
          mkdir -p "$STAGE"
          REL=target/release
          for f in \
            buzz-desktop \
            buzz-acp \
            buzz-agent \
            buzz-backend-kubernetes \
            buzz-dev-mcp \
            buzz \
            git-credential-nostr
          do
            cp "$REL/$f" "$STAGE/"
            chmod +x "$STAGE/$f"
          done
          # Copy dylibs sitting next to release bins (local STT / ORT).
          shopt -s nullglob
          for d in "$REL"/*.dylib "$REL"/deps/*.dylib; do
            base=$(basename "$d")
            case "$base" in
              *onnx*|*sherpa*|*buzz*) cp "$d" "$STAGE/" ;;
            esac
          done
          cat > "$STAGE/README.txt" <<EOF
          Bony Desktop v${VERSION} (macOS aarch64)
          ================================

          Contents
          - buzz-desktop  main desktop app (Tauri)
          - ACP/agent/cli sidecars
          - accompanying dylibs when present

          Requirements
          - macOS Apple Silicon (arm64)
          - Local grok CLI: npm i -g @xai-official/grok
          - For room collaboration: start buzz-relay separately

          Quick start
          1. Unzip this archive
          2. xattr -dr com.apple.quarantine .
          3. ./buzz-desktop
          4. BYOK via ~/.grok/config.toml

          Unsigned CI build (no Apple notarization).

          Source: https://github.com/phuhao00/bony
          Commit: ${GITHUB_SHA}
          EOF
          mkdir -p dist
          (
            cd dist
            zip -r "bony-desktop-v${VERSION}-macos-aarch64.zip" "bony-desktop-v${VERSION}-macos-aarch64"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/bony-desktop-v${{ needs.version.outputs.version }}-macos-aarch64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, windows, macos]
    if: |
      always() &&
      needs.windows.result == 'success' &&
      (github.event_name == 'push' || inputs.create_release == true || inputs.create_release == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f -name '*.zip' -exec cp {} out/ \;
          ls -la out
          test -n "$(ls -A out/*.zip 2>/dev/null)" || { echo "no zip assets"; exit 1; }

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
          MAC_STATUS: ${{ needs.macos.result }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS_LIST="- \`bony-desktop-v${VERSION}-windows-x86_64.zip\`"
          if [[ -f "out/bony-desktop-v${VERSION}-macos-aarch64.zip" ]]; then
            ASSETS_LIST+=$'\n'"- \`bony-desktop-v${VERSION}-macos-aarch64.zip\` (Apple Silicon, unsigned)"
          else
            ASSETS_LIST+=$'\n'"- _(macOS zip pending / build ${MAC_STATUS})_"
          fi
          BODY=$(cat <<EOF
          ## Bony Desktop v${VERSION}

          Portable runtime builds (unzip and run).

          ### Assets
          ${ASSETS_LIST}

          ### Notes
          - Room stack (\`buzz-relay\`) is separate — use start-room-stack when needed.
          - Coding agents: \`npm i -g @xai-official/grok\` + BYOK in \`~/.grok/config.toml\`.
          - macOS: first launch may need \`xattr -dr com.apple.quarantine .\`.

          **Commit:** \`${SHA}\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.zip --clobber
            gh release edit "$TAG" --notes "$BODY" --latest
          else
            gh release create "$TAG" out/*.zip \
              --title "Bony Desktop v${VERSION}" \
              --notes "$BODY" \
              --latest
          fi
